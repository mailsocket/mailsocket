{% extends 'dashboard/base.html' %}
{% block title %}Compose · mailsocket{% endblock %}
{% block content %}
<header class="page-head"><div><h1>Compose</h1></div></header>
{% if outbound_ui %}
<section class="card">
<form method="post" action="{% url 'dashboard:compose' %}" data-disable-on-submit>
{% csrf_token %}
<label>From inbox <select name="inbox">{% for inbox in sendable_inboxes %}<option value="{{ inbox.public_id }}">{{ inbox.label|default:inbox.address }} ({{ inbox.address }})</option>{% endfor %}</select></label>
<label>To <input type="text" name="to" placeholder="comma-separated"></label>
<label>Cc <input type="text" name="cc" placeholder="comma-separated"></label>
<label>Subject <input type="text" name="subject" maxlength="512"></label>
<label>Body <textarea name="body_text" rows="10"></textarea></label>
<button class="button" type="submit">Send</button>
</form>
</section>
{% else %}
<p>Compose is not available for this account.</p>
{% endif %}
{% endblock %}
