{% if secret %}<div class="card flash" role="status"><strong>{{ flash }} Copy this signing secret now. It will not be shown again.</strong><p><code id="created-webhook-secret">{{ secret }}</code> <button type="button" class="copy" data-copy-target="created-webhook-secret">Copy</button></p></div>
{% elif flash %}<div class="flash{% if flash_is_error %} flash-error{% endif %}" role="{% if flash_is_error %}alert{% else %}status{% endif %}">{{ flash }}</div>
{% endif %}<div id="webhook-rows" hx-swap-oob="innerHTML">{% include 'dashboard/partials/webhook_rows.html' %}</div>
